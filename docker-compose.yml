version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: infra-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./infra
      dockerfile: Dockerfile
    container_name: infra-backend
    restart: always
    depends_on:
      - database
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ACCESS_TOKEN=${JWT_ACCESS_TOKEN}
      - JWT_REFRESH_TOKEN=${JWT_REFRESH_TOKEN}
      - APP_FE_BASE_URL=${APP_FE_BASE_URL}
      - CEPH_MONITORS=${CEPH_MONITORS}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - ./infra/uploads:/app/uploads

  frontend:
    build:
      context: ./infra-ui
      dockerfile: Dockerfile
      args:
        - VITE_APP_VERSION=${VITE_APP_VERSION}
        - GENERATE_SOURCEMAP=${GENERATE_SOURCEMAP}
        - PUBLIC_URL=${PUBLIC_URL}
        - VITE_APP_BASE_NAME=${VITE_APP_BASE_NAME}
        - VITE_APP_API_URL=${VITE_APP_API_URL}
        - VITE_APP_GOOGLE_MAPS_API_KEY=${VITE_APP_GOOGLE_MAPS_API_KEY}
        - VITE_APP_MAPBOX_ACCESS_TOKEN=${VITE_APP_MAPBOX_ACCESS_TOKEN}
        - VITE_APP_FIREBASE_API_KEY=${VITE_APP_FIREBASE_API_KEY}
        - VITE_APP_FIREBASE_AUTH_DOMAIN=${VITE_APP_FIREBASE_AUTH_DOMAIN}
        - VITE_APP_FIREBASE_PROJECT_ID=${VITE_APP_FIREBASE_PROJECT_ID}
        - VITE_APP_FIREBASE_STORAGE_BUCKET=${VITE_APP_FIREBASE_STORAGE_BUCKET}
        - VITE_APP_FIREBASE_MESSAGING_SENDER_ID=${VITE_APP_FIREBASE_MESSAGING_SENDER_ID}
        - VITE_APP_FIREBASE_APP_ID=${VITE_APP_FIREBASE_APP_ID}
        - VITE_APP_FIREBASE_MEASUREMENT_ID=${VITE_APP_FIREBASE_MEASUREMENT_ID}
        - VITE_APP_AWS_POOL_ID=${VITE_APP_AWS_POOL_ID}
        - VITE_APP_AWS_APP_CLIENT_ID=${VITE_APP_AWS_APP_CLIENT_ID}
        - VITE_APP_JWT_SECRET_KEY=${VITE_APP_JWT_SECRET_KEY}
        - VITE_APP_JWT_TIMEOUT=${VITE_APP_JWT_TIMEOUT}
        - VITE_APP_AUTH0_CLIENT_ID=${VITE_APP_AUTH0_CLIENT_ID}
        - VITE_APP_AUTH0_DOMAIN=${VITE_APP_AUTH0_DOMAIN}
        - VITE_APP_PUBLIC_CLARITY_ID=${VITE_APP_PUBLIC_CLARITY_ID}
        - VITE_APP_PUBLIC_NOTIFY_ID=${VITE_APP_PUBLIC_NOTIFY_ID}
        - VITE_APP_PUBLIC_ANALYTICS_ID=${VITE_APP_PUBLIC_ANALYTICS_ID}
    container_name: infra-frontend
    restart: always
    ports:
      - "3000:80"

volumes:
  db_data:
